<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Image Gallery</h1>
        <p>Explore beautiful images</p>
    </header>

    <div class="filters">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="nature">Nature</button>
        <button class="filter-btn" data-filter="city">City</button>
        <button class="filter-btn" data-filter="animals">Animals</button>
        <button class="filter-btn" data-filter="travel">Travel</button>
    </div>

    <main class="gallery">

        <div class="gallery-item" data-category="nature" data-title="Mountain">
            <img src="https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=900&q=80" alt="Mountain">
            <div class="image-info">
                <h3>Mountain</h3>
                <span>Nature</span>
            </div>
        </div>

        <div class="gallery-item" data-category="city" data-title="City Lights">
            <img src="https://images.unsplash.com/photo-1477959858617-67f85cf4f1df?auto=format&fit=crop&w=900&q=80" alt="City">
            <div class="image-info">
                <h3>City Lights</h3>
                <span>City</span>
            </div>
        </div>

        <div class="gallery-item" data-category="animals" data-title="Wild Fox">
            <img src="https://images.unsplash.com/photo-1474511320723-9a56873867b5?auto=format&fit=crop&w=900&q=80" alt="Fox">
            <div class="image-info">
                <h3>Wild Fox</h3>
                <span>Animals</span>
            </div>
        </div>

        <div class="gallery-item" data-category="travel" data-title="Tropical Beach">
            <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=900&q=80" alt="Beach">
            <div class="image-info">
                <h3>Tropical Beach</h3>
                <span>Travel</span>
            </div>
        </div>

        <div class="gallery-item" data-category="nature" data-title="Green Forest">
            <img src="https://images.unsplash.com/photo-1448375240586-882707db888b?auto=format&fit=crop&w=900&q=80" alt="Forest">
            <div class="image-info">
                <h3>Green Forest</h3>
                <span>Nature</span>
            </div>
        </div>

        <div class="gallery-item" data-category="city" data-title="Modern City">
            <img src="https://images.unsplash.com/photo-1480714378408-67cf0d13bc1b?auto=format&fit=crop&w=900&q=80" alt="Modern City">
            <div class="image-info">
                <h3>Modern City</h3>
                <span>City</span>
            </div>
        </div>

        <div class="gallery-item" data-category="animals" data-title="Cute Puppy">
            <img src="https://images.unsplash.com/photo-1552053831-71594a27632d?auto=format&fit=crop&w=900&q=80" alt="Puppy">
            <div class="image-info">
                <h3>Cute Puppy</h3>
                <span>Animals</span>
            </div>
        </div>

        <div class="gallery-item" data-category="travel" data-title="Mountain Adventure">
            <img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=900&q=80" alt="Mountain Adventure">
            <div class="image-info">
                <h3>Mountain Adventure</h3>
                <span>Travel</span>
            </div>
        </div>

    </main>

    <!-- Lightbox -->
    <div class="lightbox" id="lightbox">

        <span class="close" id="close">&times;</span>

        <button class="nav-btn prev" id="prev">&#10094;</button>

        <div class="lightbox-content">
            <img id="lightboxImage" src="" alt="">
            <div class="lightbox-title" id="lightboxTitle"></div>
        </div>

        <button class="nav-btn next" id="next">&#10095;</button>

    </div>

    <footer>
        <p>© 2026 Image Gallery</p>
    </footer>

    <script>
        const galleryItems = document.querySelectorAll(".gallery-item");
        const filterButtons = document.querySelectorAll(".filter-btn");

        const lightbox = document.getElementById("lightbox");
        const lightboxImage = document.getElementById("lightboxImage");
        const lightboxTitle = document.getElementById("lightboxTitle");

        const closeButton = document.getElementById("close");
        const previousButton = document.getElementById("prev");
        const nextButton = document.getElementById("next");

        let visibleItems = [];
        let currentIndex = 0;

        function updateVisibleItems() {
            visibleItems = Array.from(galleryItems)
                .filter(item => item.style.display !== "none");
        }

        /* Filter Images */
        filterButtons.forEach(button => {

            button.addEventListener("click", () => {

                filterButtons.forEach(btn =>
                    btn.classList.remove("active")
                );

                button.classList.add("active");

                const filter = button.dataset.filter;

                galleryItems.forEach(item => {

                    if (
                        filter === "all" ||
                        item.dataset.category === filter
                    ) {
                        item.style.display = "block";
                    } else {
                        item.style.display = "none";
                    }

                });

                updateVisibleItems();
            });

        });

        /* Open Lightbox */
        galleryItems.forEach(item => {

            item.addEventListener("click", () => {

                updateVisibleItems();

                currentIndex = visibleItems.indexOf(item);

                showImage();

                lightbox.classList.add("show");

                document.body.style.overflow = "hidden";
            });

        });

        /* Show Image */
        function showImage() {

            const item = visibleItems[currentIndex];

            if (!item) return;

            const image = item.querySelector("img");

            lightboxImage.src = image.src;
            lightboxImage.alt = image.alt;
            lightboxTitle.textContent = item.dataset.title;
        }

        /* Next Image */
        function nextImage() {

            currentIndex++;

            if (currentIndex >= visibleItems.length) {
                currentIndex = 0;
            }

            showImage();
        }

        /* Previous Image */
        function previousImage() {

            currentIndex--;

            if (currentIndex < 0) {
                currentIndex = visibleItems.length - 1;
            }

            showImage();
        }

        nextButton.addEventListener("click", nextImage);
        previousButton.addEventListener("click", previousImage);

        /* Close Lightbox */
        function closeLightbox() {

            lightbox.classList.remove("show");

            document.body.style.overflow = "auto";
        }

        closeButton.addEventListener("click", closeLightbox);

        lightbox.addEventListener("click", event => {

            if (event.target === lightbox) {
                closeLightbox();
            }

        });

        /* Keyboard Navigation */
        document.addEventListener("keydown", event => {

            if (!lightbox.classList.contains("show")) return;

            if (event.key === "ArrowRight") {
                nextImage();
            }

            if (event.key === "ArrowLeft") {
                previousImage();
            }

            if (event.key === "Escape") {
                closeLightbox();
            }

        });

        updateVisibleItems();
    </script>

</body>
</html>
